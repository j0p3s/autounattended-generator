remote_theme: pages-themes/midnight@v0.2.0
plugins:
  - jekyll-remote-theme

title: Autounattend Generator
tagline: Interactive autounattend.xml generator for Windows 10/11
description: Interactive browser-based generator for Windows 10/11 autounattend.xml answer files, with Winhance-inspired options. Runs locally, no server.
show_downloads: false

# Files that Jekyll should not publish
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
